name: 自动构建与部署

on:
  push:
    branches: ["main"] # 当你推送到 main 分支时触发

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Pages 和 Go 启动器共用同一份 Web 产物。
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v6

      - name: 2. 安装 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: 3. 安装依赖并打包 Web 产物
        run: |
          npm ci
          npm run build:web

      - name: 4. 上传打包产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist/web'

  deploy:
    needs: build-web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Chrome 扩展产物：打包为可直接加载的 ZIP 并作为 artifact 上传
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v6

      - name: 2. 安装 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: 3. 安装依赖并打包 Chrome 扩展产物
        run: |
          npm ci
          npm run build:chrome

      - name: 4. 压缩扩展目录
        working-directory: ./dist/chrome
        run: zip -r ../../chrome-extension.zip .

      - name: 5. 上传扩展产物
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: chrome-extension.zip
          if-no-files-found: error

  # Go 检查可在 Web 打包时执行，静态资源目录有 Git 占位文件。
  go-check:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v6

      - name: 2. 安装 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false # 仅使用标准库，没有 go.sum。

      - name: 3. 检查 Go 代码
        working-directory: ./go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  go-binaries:
    needs: [build-web, go-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            extension: ''
          - goos: darwin
            goarch: amd64
            extension: ''
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: arm64
            extension: .exe
          - goos: linux
            goarch: amd64
            extension: ''
    env:
      BINARY_NAME: forge-${{ matrix.goos }}-${{ matrix.goarch }}
      BINARY_EXTENSION: ${{ matrix.extension }}
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v6

      - name: 2. 安装 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false # 仅使用标准库，没有 go.sum。

      - name: 3. 下载 Web 构建产物
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/forge-web

      - name: 4. 嵌入 Web 产物并编译 Go 启动器
        working-directory: ./go
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          tar -xf "$RUNNER_TEMP/forge-web/artifact.tar" -C internal/web/static/site
          test -s internal/web/static/site/index.html
          mkdir -p ../dist/bin
          go build -trimpath -ldflags='-s -w' -o "../dist/bin/${BINARY_NAME}${BINARY_EXTENSION}" ./cmd/forge

      - name: 5. 上传可执行文件
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}
          path: dist/bin/${{ env.BINARY_NAME }}${{ env.BINARY_EXTENSION }}
          if-no-files-found: error
